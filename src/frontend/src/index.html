<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>El Sazón</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />
  <script type="module">
    import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

    createChat({
      webhookUrl: 'http://localhost:5678/webhook/4aa24932-ad95-46bf-be19-d5b8fcf63470/chat',
      locale: 'es',
      initialMessages: [
        '¡Hola! 👋 Soy el asistente virtual de Mi Restaurante. ¿En qué puedo ayudarte?'
      ],
      i18n: {
        es: {
          title: 'Asistente Virtual',
          subtitle: 'Estoy aquí para ayudarte',
          inputPlaceholder: 'Escribe tu pregunta...'
        }
      },
      theme: {
        button: {
          backgroundColor: '#e63946',
          iconColor: '#ffffff'
        },
        chatWindow: {
          backgroundColor: '#ffffff'
        }
      }
    });
  </script>

  <style>
    :root {
      --chat--color-primary: #ea580c;
      --chat--color-secondary: #f97316;
      --chat--color-accent: #facc15;
      --chat--color-white: #ffffff;
      --chat--color-bg: #fffaf5;
    }

    .chat-window-toggle {
      width: 72px !important;
      height: 72px !important;
      border-radius: 50% !important;
      background: linear-gradient(135deg, #ea580c, #f97316) !important;
      box-shadow: 0 10px 25px rgba(234, 88, 12, .35);
      transition: .3s;
    }

    .chat-window-toggle:hover {
      transform: scale(1.08);
      box-shadow: 0 15px 35px rgba(234, 88, 12, .45);
    }

    .chat-window {
      border-radius: 22px !important;
      overflow: hidden;
      border: none !important;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .18);
      background: var(--chat--color-bg);
    }

    .chat-header {
      background: linear-gradient(135deg, #ea580c, #f97316) !important;
      color: white !important;
      padding: 18px !important;
      font-weight: 600;
      border-bottom: none;
    }

    .chat-message-from-bot {
      background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
      color: white !important;
      border-radius: 18px 18px 18px 6px !important;
      box-shadow: 0 4px 12px rgba(59, 130, 246, .18);
    }

    .chat-message-from-user {
      background: #ffffff !important;
      color: #374151 !important;
      border: 1px solid #fde68a;
      border-radius: 18px 18px 6px 18px !important;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .05);
    }

    .chat-input {
      border-radius: 14px !important;
      border: 2px solid #fed7aa !important;
      transition: .3s;
    }

    .chat-input:focus {
      border-color: #f97316 !important;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, .15) !important;
    }

    .chat-send-button {
      background: #ea580c !important;
      color: white !important;
      border-radius: 12px !important;
      transition: .3s;
    }

    .chat-send-button:hover {
      background: #c2410c !important;
      transform: scale(1.05);
    }

    .chat-body::-webkit-scrollbar {
      width: 8px;
    }

    .chat-body::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 20px;
    }

    .chat-body::-webkit-scrollbar-track {
      background: #fff7ed;
    }
  </style>
</head>

<body>
  <app-root></app-root>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
