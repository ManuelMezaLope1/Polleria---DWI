<nav class="navbar">
  <div class="nav-container">
    <!-- Logo a la izquierda -->
    <div class="nav-brand">
      <a routerLink="inicio" class="brand-link">
        <span class="brand-icon">🍗</span>
        <span class="brand-text">El Sazón</span>
      </a>
    </div>

    <!-- Botón hamburguesa (para móvil) -->
    <button class="nav-toggle" (click)="toggleMenu()" [class.active]="menuAbierto">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Menú de navegación -->
    <ul class="nav-menu" [class.show]="menuAbierto">
      <!-- Enlaces principales -->
      <li class="nav-item">
        <a routerLink="inicio" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">
          <i class="material-icons">home</i>
          <span>Inicio</span>
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="carta" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">
          <i class="material-icons">menu_book</i>
          <span>Carta</span>
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="promocion" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">
          <i class="material-icons">percent</i>
          <span>Promocion</span>
        </a>
      </li>

      <li class="nav-item">
        <a routerLink="contacto" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">
          <i class="material-icons">contact_support</i>
          <span>Contacto</span>
        </a>
      </li>

      <li *ngIf="authService.logueado()" class="nav-item">
        <a routerLink="cuenta" routerLinkActive="active" class="nav-link" (click)="cerrarMenu()">
          <i class="material-icons">account_circle</i>
          <span>Cuenta</span>
        </a>
      </li>

      <li *ngIf="authService.logueado()" class="nav-item">
        <div *ngIf="rol!='ROLE_USER'">
          <a routerLink="dashboard" routerLinkActive="active" class="nav-link" (click)="irDashboard(usuarioRol); cerrarMenu()">
            <i class="material-icons">dashboard</i>
            <span>Dashboard</span>
          </a>
        </div>
      </li>

      <!-- Separador (solo en desktop) -->
      <li class="nav-separator"></li>

      <!-- Botones de autenticación -->
      <li *ngIf="!authService.logueado()" class="auth-item">
        <a routerLink="iniciar-sesion" routerLinkActive="active" class="nav-link btn-auth" (click)="cerrarMenu()">
          <i class="material-icons">login</i>
          <span>Iniciar Sesión</span>
        </a>
      </li>

      <li *ngIf="authService.logueado()" class="auth-item">
        <button (click)="logout()" routerLinkActive="active" class="nav-link btn-auth">
          <i class="material-icons">logout</i>
          <span>Cerrar sesión</span>
        </button>
      </li>

      <li class="auth-item">
        <div *ngIf="themeServicio.getTheme()==='light'">
          <button class="nav-link btn-auth" (click)="cambiarTema()"><span class="material-icons">sunny</span></button>
        </div>

        <div *ngIf="themeServicio.getTheme()==='dark'">
          <button class="nav-link btn-auth" (click)="cambiarTema()"><span class="material-icons">bedtime</span></button>
        </div>
      </li>
    </ul>
  </div>
</nav>
