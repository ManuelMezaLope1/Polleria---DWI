<div class="fachada" *ngIf="active==='puerta'" [class.abrir]="abriendo" (click)="abrirPuertas()">
    <div class="ventana">
        <div class="vidrio"></div>
    </div>

    <div style="display:flex; flex-direction: column;">
        <div class="ventana-pequeña">
            <div class="vidrio-pequeño"></div>
        </div>

        <div class="letrero">
            <span class="icono">🍗</span>
            POLLERÍA EL BUEN SABOR
        </div>

        <div class="puerta-doble">
            <div class="hoja izq"></div>
            <div class="hoja der"></div>
        </div>
    </div>

    <div class="ventana">
        <div class="vidrio"></div>
    </div>
</div>
