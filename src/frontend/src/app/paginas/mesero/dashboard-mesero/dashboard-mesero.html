<div class="dashboard-container">
    <aside class="sidebar">
        <div class="logo">
            🍗 Pollería
        </div>

        <div class="menu">
            <button class="menu-item" [class.active]="active==='inicio'" (click)="onInicioTab()">
                <i class="material-icons">home</i>
                <span>Inicio</span>
            </button>
        </div>
    </aside>

    <main class="contenido">
        <div class="tab-content">
            <div [ngClass]="active == 'inicio' ? 'tab-pane fade show active' : 'tab-pane fade'">
                <h1>Inicio</h1>
                <br>
                <div class="kpi-grid">
                    <div class="kpi-card kpi-libre">
                        <i class="material-icons">tag</i>
                        <h3>0</h3>
                        <span>mesas libres</span>
                    </div>

                    <div class="kpi-card kpi-esperando">
                        <i class="material-icons">tag</i>
                        <h3>0</h3>
                        <span>mesas esperando</span>
                    </div>

                    <div class="kpi-card kpi-ocupado">
                        <i class="material-icons">tag</i>
                        <h3>0</h3>
                        <span>mesas ocupadas</span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
