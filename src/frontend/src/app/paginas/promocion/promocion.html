<section class="banner w-100">
    <img src="../imagenes/promociones/combo.png" alt="Banner Promo" class="img-fluid w-100"
        style="height: 350px; object-fit: cover;">
</section>

<div class="container mt-5">
    <h2 class="titulo text-center mb-5 fw-bold text-uppercase">Nuestras Promociones</h2>

    <div class="row g-4">
        <div class="col-md-4" *ngFor="let ofe of ofertas$ | async">
            <div class="card shadow-sm h-100 text-center">
                <img src="../imagenes/promociones/promotueliges.png" class="card-img-top" alt="Promo"
                    style="height: 220px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title fw-bold text-danger">{{ofe.nombre}}</h5>
                    <p class="card-text text-muted small">{{ofe.descripcion}}</p>
                    <p class="precio-nuevo">Ahora a tan solo: S/. {{ofe.precio_nuevo}}</p>
                    <div class="badge bg-danger fs-6 p-2 mb-3">{{getDescuento(ofe)}}% DCTO</div>
                </div>
                <div class="card-footer bg-transparent border-0 pb-3">
                    <button class="btn btn-warning w-100 fw-bold">Pedir Ahora</button>
                </div>
            </div>
        </div>
    </div>
    <br>
</div>
