<section id="actualizacion-zona">
    <div class="col-md-6 offset-md-3">
        <br><br>
        <h3 class="text-center">Edición de Zonas</h3>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <label for="nombre">Nombre: </label>
                <input type="text" class="form-control" formControlName="nombre">
            </div>

            <div class="form-group">
                <label for="departamento">Departamento: </label>
                <select class="form-control" formControlName="departamento" id="departamento">
                    <option value="null">--Seleccione el departamento--</option>
                    <option *ngFor="let d of departamentos" [value]="d">{{d}}</option>
                </select>
            </div>

            <div class="form-group">
                <label for="provincia">Provincia: </label>
                <select class="form-control" formControlName="provincia" id="provincia">
                    <option value="null">--Seleccione la provincia--</option>
                    <option *ngFor="let pro of provinciasFiltradas" [value]="pro">{{pro}}</option>
                </select>
            </div>

            <button class="btn btn-success">Guardar</button>

        </form>
        <br>
    </div>
</section>
